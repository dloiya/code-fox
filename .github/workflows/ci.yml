name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Keep Clippy visible, but don't make pre-existing workspace warnings
      # block the Windows executable build. Rust errors still fail the step.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build Windows executable
        run: cargo build --locked --profile diag -p victory --features diagnostics
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: code-fox-windows-diag
          path: target/diag/victory.exe
          if-no-files-found: error
          retention-days: 7
